name: Sync official stable tags

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'upstream.lock.json'
      - '.gitattributes'
      - 'AGENTS.md'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional explicit official stable tag'
        type: string
        required: false
      approve_series:
        description: 'Approve a new WordPress major/minor release series'
        type: boolean
        default: false
      sqlite_tag:
        description: 'Optional published SQLite driver vX.Y.Z tag'
        type: string
        required: false

concurrency:
  group: wplite-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.seal.outputs.ready }}
      handoff_sha256: ${{ steps.seal.outputs.handoff_sha256 }}
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Name the pinned source checkout
        run: git switch -c main
      - name: Discover and rebase only official stable tags
        env:
          WPLITE_GITHUB_API_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          APPROVE_SERIES: ${{ inputs.approve_series }}
          SQLITE_TAG: ${{ inputs.sqlite_tag }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          arguments = ['python3', 'tools/wplite.py', 'sync']
          if os.environ.get('REQUESTED_TAG'):
              arguments += ['--tag', os.environ['REQUESTED_TAG']]
          if os.environ.get('APPROVE_SERIES') == 'true':
              arguments += ['--approve-series']
          if os.environ.get('SQLITE_TAG'):
              arguments += ['--sqlite-tag', os.environ['SQLITE_TAG']]
          subprocess.run(arguments, check=True)
          PY
      - name: Require the locked candidate to match canonical runtime source
        run: python3 tools/wplite.py verify --overlay
      - name: Seal data-only discovery handoff before any candidate code executes
        id: seal
        env:
          APPROVE_SERIES: ${{ inputs.approve_series }}
        run: python3 tools/sync_handoff.py export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: handoff
        with:
          name: wplite-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/sync-handoff/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Name the pinned source checkout
        run: git switch -c main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.discover.outputs.artifact_id }}
          path: .cache/sync-handoff/
          merge-multiple: true
      - name: Verify source-bound discovery data and import only pinned Git objects
        env:
          WPLITE_HANDOFF_SHA256: ${{ needs.discover.outputs.handoff_sha256 }}
          WPLITE_GITHUB_API_TOKEN: ${{ github.token }}
          APPROVE_SERIES: ${{ inputs.approve_series }}
        run: python3 tools/sync_handoff.py import
      - name: Test tooling and source parity
        if: needs.discover.outputs.ready == 'true'
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/wplite.py verify --overlay
      - name: Prepare isolated test PHP
        if: needs.discover.outputs.ready == 'true'
        run: python3 tools/prepare_test_runtime.py
      - name: Verify installation, HTTP behavior and reproducible build
        if: needs.discover.outputs.ready == 'true'
        run: |
          .cache/test-runtime/install/bin/php tests/environment.php
          python3 tests/smoke.py --php .cache/test-runtime/install/bin/php
          python3 tests/web_install.py --php .cache/test-runtime/install/bin/php --httpd /usr/sbin/apache2 --apache-modules /usr/lib/apache2/modules
          python3 tests/diagnostics.py --php .cache/test-runtime/install/bin/php
          python3 tools/wplite.py build
      - name: Record rebase comparison
        if: needs.discover.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          r = json.loads(Path('.cache/sync-result.json').read_text())
          subprocess.run(['git', 'range-diff', r['old_base'] + '..' + r['previous_integration'], r['new_base'] + '..' + r['commit']], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.discover.outputs.ready == 'true'
        with:
          name: wplite-sync-candidate
          path: dist/
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [discover, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Name the pinned source checkout
        run: git switch -c main
      # Only discovery's immutable artifact ID is accepted. Never download the
      # validation runner's ZIP, Git state, caches, tools or arbitrary receipts.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.discover.outputs.artifact_id }}
          path: .cache/sync-handoff/
          merge-multiple: true
      - name: Independently verify trusted data without executing candidate PHP
        env:
          WPLITE_HANDOFF_SHA256: ${{ needs.discover.outputs.handoff_sha256 }}
          WPLITE_GITHUB_API_TOKEN: ${{ github.token }}
          APPROVE_SERIES: ${{ inputs.approve_series }}
        run: python3 tools/sync_handoff.py import
      - name: Publish candidate and draft sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          WPLITE_HANDOFF_SHA256: ${{ needs.discover.outputs.handoff_sha256 }}
          APPROVE_SERIES: ${{ inputs.approve_series }}
        run: python3 tools/publish_sync_pr.py
