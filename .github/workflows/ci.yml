name: SQLite compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Test the latest official stable core; never sync, commit or publish it.
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: sqlite-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare isolated patched PHP and SQLite without MySQL extensions
        run: python3 tools/prepare_test_runtime.py
      - name: Test integration package and setup boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Check SQLite environment policy
        run: .cache/test-runtime/install/bin/php -n tests/environment.php
      - name: Test official installation, native core upgrade, SQLite and HTTP
        run: >-
          python3 tests/smoke.py --php .cache/test-runtime/install/bin/php
          --from-version 7.1.2 --to-version latest
